name: release

on:
  push:
    tags:
      - "v*"

# Cancel any in-flight release run for the same tag if it's re-pushed.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # needed to publish the GitHub Release

jobs:
  release:
    # macOS runner so codesigning / notarization can be added later without
    # cross-runner moves. Bun cross-compiles all four targets from any host.
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(bun -e 'console.log(require("./package.json").version)')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Cross-compile binaries
        run: scripts/build-all.sh "$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set; skipping tap update."
            echo "Add a fine-grained PAT with contents:write on markcipolla/homebrew-tap as HOMEBREW_TAP_TOKEN."
            exit 0
          fi
          scripts/update-tap.sh "$VERSION"
